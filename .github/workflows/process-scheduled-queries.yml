name: Process Scheduled Queries

on:
  schedule:
    # Off round numbers (not :00/:30) so this isn't queued behind every other
    # repo's cron jobs that fire on the popular times.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # GitHub Actions' own ceiling for this job — adjust as needed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled query processing
        env:
          # Rename these to whatever your services actually read from
          # process.env — check appwrite-server.ts, weaviate-service.ts, etc.
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          WEAVIATE_URL: ${{ secrets.WEAVIATE_URL }}
          WEAVIATE_API_KEY: ${{ secrets.WEAVIATE_API_KEY }}
        run: npx tsx scripts/process-scheduled.ts