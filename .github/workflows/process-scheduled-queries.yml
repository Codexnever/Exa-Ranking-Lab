name: Process Scheduled Queries

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Call process-scheduled endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

        run: |
          set -euo pipefail

          response=$(curl \
            --silent \
            --show-error \
            --max-time 120 \
            -w "\n%{http_code}" \
            -X GET \
            "${APP_URL}/api/cron/process-scheduled" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $http_code"
          echo "Response body:"

          if echo "$body" | jq . 2>/dev/null; then
            true
          else
            echo "$body"
          fi

          if [ "$http_code" -ge 400 ]; then
            echo "::error::Request failed with status $http_code"
            exit 1
          fi