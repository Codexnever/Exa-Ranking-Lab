# .github/workflows/process-scheduled-queries.yml
#
# Triggers /api/cron/process-scheduled every 30 minutes.
#
# Setup:
# 1. Add repository secrets:
#      APP_URL     = https://your-production-app.vercel.app
#      CRON_SECRET = same value as CRON_SECRET in Vercel
#
# 2. APP_URL should NOT have a trailing slash.
#
# 3. This workflow must exist on the default branch for scheduled runs.
#
# 4. You can also trigger it manually from:
#      GitHub → Actions → Process Scheduled Queries → Run workflow

name: Process Scheduled Queries

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Call process-scheduled endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "🚀 Exa Ranking Lab Scheduler"
          echo "=========================================="
          echo "UTC time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "GitHub run ID: ${GITHUB_RUN_ID}"
          echo ""

          # ─────────────────────────────────────
          # Validate required secrets
          # ─────────────────────────────────────

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL secret is missing"
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is missing"
            exit 1
          fi

          echo "APP_URL is configured"
          echo "CRON_SECRET is configured"
          echo ""

          # Remove trailing slash if one accidentally exists
          APP_URL="${APP_URL%/}"

          endpoint="${APP_URL}/api/cron/process-scheduled"

          echo "Calling scheduler endpoint..."
          echo ""

          body_file=$(mktemp)

          start_time=$(date +%s)

          # --location follows 301/302/307/308 redirects.
          #
          # We intentionally don't use --fail-with-body here because we want
          # to capture and print the API response even when it returns 4xx/5xx.
          http_code=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 120 \
            --connect-timeout 20 \
            --output "$body_file" \
            --write-out "%{http_code}" \
            -X GET "$endpoint" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json")

          end_time=$(date +%s)
          duration=$((end_time - start_time))

          echo "=========================================="
          echo "Scheduler Response"
          echo "=========================================="
          echo "HTTP status: ${http_code}"
          echo "Duration: ${duration}s"
          echo ""
          echo "Response body:"

          if [ -s "$body_file" ]; then
            jq . "$body_file" 2>/dev/null || cat "$body_file"
          else
            echo "(empty response body)"
          fi

          echo ""
          echo "=========================================="

          # ─────────────────────────────────────
          # Only HTTP 2xx counts as success
          # ─────────────────────────────────────

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Scheduler request failed with HTTP ${http_code}"
            rm -f "$body_file"
            exit 1
          fi

          # Optional additional validation:
          # If API returned JSON with success:false, fail the workflow too.
          api_success=$(jq -r '.success // empty' "$body_file" 2>/dev/null || true)

          if [ "$api_success" = "false" ]; then
            echo "::error::Scheduler API returned success=false"
            rm -f "$body_file"
            exit 1
          fi

          rm -f "$body_file"

          echo ""
          echo "✅ Scheduler completed successfully"
